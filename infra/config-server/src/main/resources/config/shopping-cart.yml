server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:shopping-cart-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
      client:
        config:
          warehouse:
            connectTimeout: 1000
            readTimeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      warehouseCheckProductQuantityEnoughForShoppingCart:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - feign.FeignException$BadRequest
  timelimiter:
    instances:
      warehouseCheckProductQuantityEnoughForShoppingCart:
        timeoutDuration: 2s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ru.yandex.practicum.commerce.cart: INFO
