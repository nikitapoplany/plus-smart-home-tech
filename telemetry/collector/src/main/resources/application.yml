server:
  port: 8080

spring:
  application:
    name: telemetry-collector

app:
  kafka:
    bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      sensors: telemetry.sensors.v1
      hubs: telemetry.hubs.v1

logging:
  level:
    root: INFO
    ru.yandex.practicum.telemetry.collector: INFO

echo:
  enabled: false

grpc:
  server:
    # Порт gRPC сервера Collector. Тесты ожидают localhost:59091
    port: ${GRPC_SERVER_PORT:59091}
